[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "wxbridge"
version = "0.2.0"
description = "Independent Windows Weixin desktop automation for AI assistants"
requires-python = ">=3.11,<3.14"
dependencies = ["comtypes>=1.4.10,<2; sys_platform == 'win32'", "pywin32>=308; sys_platform == 'win32'"]
readme = "README.md"

[project.scripts]
wxbridge = "wxbridge.cli:main"
wxbridge-onebot = "wxbridge.onebot.cli:main"

[project.optional-dependencies]
onebot = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "websockets>=15,<17", "pillow>=12,<14"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "capstone>=5,<6"]

[tool.hatch.build.targets.wheel]
packages = ["src/wxbridge"]

[[tool.uv.index]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--basetemp=.pytest-tmp"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", ".uv-cache", ".pytest-tmp", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
